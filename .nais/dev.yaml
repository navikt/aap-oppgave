apiVersion: nais.io/v1alpha1
kind: Application

metadata:
  name: oppgave
  namespace: aap
  labels:
    team: aap
    sub: oppgave
    systemkatalog.nav.no/system: SK-268

spec:
  ingresses:
    - https://aap-oppgave.intern.dev.nav.no
  image: {{image}}
  port: 8080
  resources:
    limits:
      memory: 1536Mi
    requests:
      cpu: 500m
      memory: 1024Mi
  observability:
    autoInstrumentation:
      enabled: true
      runtime: "java"
    logging:
      destinations:
        - id: elastic
        - id: loki
  gcp:
    sqlInstances:
      - type: POSTGRES_16
        tier: db-custom-1-3840
        diskAutoresize: true
        highAvailability: true
        pointInTimeRecovery: true
        databases:
          - name: oppgave
  prometheus:
    enabled: true
    path: /actuator/metrics
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        extra:
          - "NAVident"
          - "azp_name"
        groups:
          - id: 3377dc51-ca61-4e36-b812-21b5fc34474f # AAP_SAKSBEHANDLER_NASJONAL
          - id: 33e00155-169b-41e5-8a3f-5582ed975a15 # AAP_SAKSBEHANDLER_OPPFOLGING
          - id: c3e18aef-a7ac-49df-806e-4fe58b81460d # AAP_KVALITETSSIKRER
          - id: f0f6cad5-e3c0-4308-99a2-3630ac60174a # AAP_BESLUTTER
          - id: c75883f9-4cb2-42c7-b75c-3f0f29ee3ead # AAP_PRODUKSJONSSTYRING
          - id: bc89623f-4624-4978-ac54-acd048c0f2a5 # AAP_DRIFT
          - id: 8e5bc6be-a934-41f0-8a92-e974ea7b80d3 # AAP_DRIFT_LES
          - id: ee2a0374-97a6-462e-9a05-3cb7be3d8fc5 # NAIS_TEAM_AAP
  liveness:
    path: /actuator/live
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: /actuator/ready
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 5
  envFrom:
    - secret: kelvin-unleash-api-token
  accessPolicy:
    inbound:
      rules:
        - application: behandlingsflyt
          permissions:
            roles:
              - oppdater-behandlingsflyt-oppgaver
              - hent-oppgave-enhet
        - application: postmottak-backend
          permissions:
            roles:
              - oppdater-postmottak-oppgaver
        - application: paw-patrol
        - application: api-intern
        - application: saksbehandling
        - application: saksbehandling-lokal # For lokal utvikling. IKKE kopier denne til prod.yaml
        - application: azure-token-generator # Ikke i prod :)
          namespace: nais
          cluster: dev-gcp
          permissions:
            roles:
              - "hent-oppgave-enhet"
    outbound:
      external:
        - host: pdl-api.dev-fss-pub.nais.io
        - host: veilarbarena.dev-fss-pub.nais.io
        - host: aap-unleash-api.nav.cloud.nais.io
      rules:
        - application: tilgang
        - application: statistikk
        - application: behandlingsflyt
        - application: skjermede-personer-pip
          namespace: nom
        - application: nom-api
          namespace: nom
        - application: veilarboppfolging
          namespace: poao
        - application: syfooversiktsrv
          namespace: teamsykefravr
        - application: logging
          namespace: nais-system
  env:
    - name: INTEGRASJON_TILGANG_URL
      value: http://tilgang
    - name: INTEGRASJON_TILGANG_SCOPE
      value: api://dev-gcp.aap.tilgang/.default
    - name: INTEGRASJON_STATISTIKK_URL
      value: http://statistikk
    - name: INTEGRASJON_STATISTIKK_SCOPE
      value: api://dev-gcp.aap.statistikk/.default
    - name: INTEGRASJON_PDL_URL
      value: https://pdl-api.dev-fss-pub.nais.io
    - name: INTEGRASJON_PDL_SCOPE
      value: api://dev-fss.pdl.pdl-api/.default
    - name: INTEGRASJON_NORG_URL
      value: https://norg2.dev-fss-pub.nais.io
    - name: INTEGRASJON_NOM_URL
      value: http://skjermede-personer-pip.nom
    - name: INTEGRASJON_NOM_SCOPE
      value: api://dev-gcp.nom.skjermede-personer-pip/.default
    - name: INTEGRASJON_NOM_API_URL
      value: http://nom-api.nom/graphql
    - name: INTEGRASJON_NOM_API_SCOPE
      value: api://dev-gcp.nom.nom-api/.default
    - name: MS_GRAPH_BASE_URL
      value: https://graph.microsoft.com/v1.0/
    - name: MS_GRAPH_SCOPE
      value: https://graph.microsoft.com/.default
    - name: INTEGRASJON_VEILARBARENA_URL
      value: https://veilarbarena.dev-fss-pub.nais.io
    - name: INTEGRASJON_VEILARBARENA_SCOPE
      value: api://dev-fss.pto.veilarbarena/.default
    - name: INTEGRASJON_VEILARBOPPFOLGING_URL
      value: http://veilarboppfolging.poao
    - name: INTEGRASJON_VEILARBOPPFOLGING_SCOPE
      value: api://dev-gcp.poao.veilarboppfolging/.default
    - name: INTEGRASJON_SYFO_URL
      value: http://syfooversiktsrv.teamsykefravr
    - name: INTEGRASJON_SYFO_SCOPE
      value: api://dev-gcp.teamsykefravr.syfooversiktsrv/.default
    - name: INTEGRASJON_BEHANDLINGSFLYT_URL
      value: http://behandlingsflyt
    - name: INTEGRASJON_BEHANDLINGSFLYT_SCOPE
      value: api://dev-gcp.aap.behandlingsflyt/.default
    - name: AZP_API_INTERN
      value: a809fc0a-eabb-4107-8231-61210adc2b70
    - name: AAP_SAKSBEHANDLER_NASJONAL
      value: 3377dc51-ca61-4e36-b812-21b5fc34474f
    - name: AAP_SAKSBEHANDLER_OPPFOLGING
      value: 33e00155-169b-41e5-8a3f-5582ed975a15
    - name: AAP_KVALITETSSIKRER
      value: c3e18aef-a7ac-49df-806e-4fe58b81460d
    - name: AAP_BESLUTTER
      value: f0f6cad5-e3c0-4308-99a2-3630ac60174a
    - name: AAP_PRODUKSJONSSTYRING
      value: c75883f9-4cb2-42c7-b75c-3f0f29ee3ead
    - name: AAP_DRIFT
      value: bc89623f-4624-4978-ac54-acd048c0f2a5
    - name: AAP_DRIFT_LES
      value: 8e5bc6be-a934-41f0-8a92-e974ea7b80d3
    - name: NAIS_TEAM_AAP
      value: ee2a0374-97a6-462e-9a05-3cb7be3d8fc5
