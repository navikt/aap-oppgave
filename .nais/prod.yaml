apiVersion: nais.io/v1alpha1
kind: Application

metadata:
  name: oppgave
  namespace: aap
  labels:
    team: aap
    sub: oppgave
    systemkatalog.nav.no/system: SK-268

spec:
  image: {{image}}
  port: 8080
  resources:
    limits:
      memory: 1536Mi
    requests:
      cpu: 500m
      memory: 1024Mi
  observability:
    autoInstrumentation:
      enabled: true
      runtime: "java"
    logging:
      destinations:
        - id: elastic
        - id: loki
  gcp:
    sqlInstances:
      - type: POSTGRES_16
        tier: db-custom-1-3840
        diskAutoresize: true
        highAvailability: true
        pointInTimeRecovery: true
        databases:
          - name: oppgave
  prometheus:
    enabled: true
    path: /actuator/metrics
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        extra:
          - "NAVident"
          - "azp_name"
        groups:
          - id: dc8b0182-1449-445a-833c-1a4620b7c2be # AAP_SAKSBEHANDLER_OPPFOLGING
          - id: 3a65f41a-b3f3-4b1c-830a-df20ff020980 # AAP_SAKSBEHANDLER_NASJONAL
          - id: a6bf143f-fee9-41ab-a487-f54503a28de6 # AAP_KVALITETSSIKRER
          - id: 5763b52f-f16a-483d-8f40-25be9de95c0a # AAP_BESLUTTER
          - id: 1d61ecf2-fcca-4dbb-ba49-82ab01aef96e # AAP_PRODUKSJONSSTYRING
          - id: ff9a228b-4aab-47bd-8aee-598d80f0fb4b # AAP_DRIFT
          - id: ec868c89-5d4f-47b4-8298-e954035d3873 # AAP_DRIFT_LES
          - id: ee2a0374-97a6-462e-9a05-3cb7be3d8fc5 # NAIS_TEAM_AAP
  liveness:
    path: /actuator/live
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 5
  readiness:
    path: /actuator/ready
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 5
  envFrom:
    - secret: kelvin-unleash-api-token
  accessPolicy:
    inbound:
      rules:
        - application: behandlingsflyt
          permissions:
            roles:
              - oppdater-behandlingsflyt-oppgaver
              - hent-oppgave-enhet
        - application: postmottak-backend
          permissions:
            roles:
              - oppdater-postmottak-oppgaver
        - application: paw-patrol
        - application: api-intern
        - application: saksbehandling
    outbound:
      external:
        - host: pdl-api.prod-fss-pub.nais.io
        - host: veilarbarena.prod-fss-pub.nais.io
        - host: aap-unleash-api.nav.cloud.nais.io
      rules:
        - application: tilgang
        - application: statistikk
        - application: behandlingsflyt
        - application: skjermede-personer-pip
          namespace: nom
        - application: nom-api
          namespace: nom
        - application: veilarboppfolging
          namespace: poao
        - application: syfooversiktsrv
          namespace: teamsykefravr
        - application: logging
          namespace: nais-system
  env:
    - name: INTEGRASJON_TILGANG_URL
      value: http://tilgang
    - name: INTEGRASJON_TILGANG_SCOPE
      value: api://prod-gcp.aap.tilgang/.default
    - name: INTEGRASJON_STATISTIKK_URL
      value: http://statistikk
    - name: INTEGRASJON_STATISTIKK_SCOPE
      value: api://prod-gcp.aap.statistikk/.default
    - name: INTEGRASJON_PDL_URL
      value: https://pdl-api.prod-fss-pub.nais.io
    - name: INTEGRASJON_PDL_SCOPE
      value: api://prod-fss.pdl.pdl-api/.default
    - name: INTEGRASJON_NORG_URL
      value: https://norg2.prod-fss-pub.nais.io
    - name: INTEGRASJON_NOM_URL
      value: http://skjermede-personer-pip.nom
    - name: INTEGRASJON_NOM_SCOPE
      value: api://prod-gcp.nom.skjermede-personer-pip/.default
    - name: INTEGRASJON_NOM_API_URL
      value: http://nom-api.nom/graphql
    - name: INTEGRASJON_NOM_API_SCOPE
      value: api://prod-gcp.nom.nom-api/.default
    - name: MS_GRAPH_BASE_URL
      value: https://graph.microsoft.com/v1.0/
    - name: MS_GRAPH_SCOPE
      value: https://graph.microsoft.com/.default
    - name: INTEGRASJON_VEILARBARENA_URL
      value: https://veilarbarena.prod-fss-pub.nais.io
    - name: INTEGRASJON_VEILARBARENA_SCOPE
      value: api://prod-fss.pto.veilarbarena/.default
    - name: INTEGRASJON_VEILARBOPPFOLGING_URL
      value: http://veilarboppfolging.poao
    - name: INTEGRASJON_VEILARBOPPFOLGING_SCOPE
      value: api://prod-gcp.poao.veilarboppfolging/.default
    - name: INTEGRASJON_SYFO_URL
      value: http://syfooversiktsrv.teamsykefravr
    - name: INTEGRASJON_SYFO_SCOPE
      value: api://prod-gcp.teamsykefravr.syfooversiktsrv/.default
    - name: INTEGRASJON_BEHANDLINGSFLYT_URL
      value: http://behandlingsflyt
    - name: INTEGRASJON_BEHANDLINGSFLYT_SCOPE
      value: api://prod-gcp.aap.behandlingsflyt/.default
    - name: AZP_API_INTERN
      value: 3d3bb28c-d020-46b2-a34a-85201e302878
    - name: AAP_SAKSBEHANDLER_OPPFOLGING
      value: dc8b0182-1449-445a-833c-1a4620b7c2be
    - name: AAP_SAKSBEHANDLER_NASJONAL
      value: 3a65f41a-b3f3-4b1c-830a-df20ff020980
    - name: AAP_KVALITETSSIKRER
      value: a6bf143f-fee9-41ab-a487-f54503a28de6
    - name: AAP_BESLUTTER
      value: 5763b52f-f16a-483d-8f40-25be9de95c0a
    - name: AAP_PRODUKSJONSSTYRING
      value: 1d61ecf2-fcca-4dbb-ba49-82ab01aef96e
    - name: AAP_DRIFT
      value: ff9a228b-4aab-47bd-8aee-598d80f0fb4b
    - name: AAP_DRIFT_LES
      value: ec868c89-5d4f-47b4-8298-e954035d3873
    - name: NAIS_TEAM_AAP
      value: ee2a0374-97a6-462e-9a05-3cb7be3d8fc5
